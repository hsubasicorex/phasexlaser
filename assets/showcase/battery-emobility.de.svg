<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t-battery-emobility d-battery-emobility"><title id="t-battery-emobility">Batterie und Elektromobilität</title><desc id="d-battery-emobility">Original-Systemschema von PhaseX. Geräteklasse und Leistungsumfang. Batterie und Elektromobilität. Liegt bei anderen: Schweißqualifizierung — Sache des Herstellers; Dichtheitsnachweis — Sache des Herstellers.</desc><style>.pf-sweep{animation:pfx 6s linear infinite}.pf-sweep-x{animation:pfxs 5s ease-in-out infinite alternate}.pf-sweep-g{animation:pfxs 6s ease-in-out infinite alternate}.pf-sweep-f{animation:pfxf 5s ease-in-out infinite alternate}.pf-pulse{animation:pfp 3s ease-in-out infinite}@keyframes pfx{0%{opacity:0;transform:translateX(0)}8%{opacity:1}92%{opacity:1}100%{opacity:0;transform:translateX(1180px)}}@keyframes pfxs{from{transform:translateX(-120px)}to{transform:translateX(120px)}}@keyframes pfxf{from{transform:translateX(0)}to{transform:translateX(180px)}}@keyframes pfp{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.pf-sweep,.pf-sweep-x,.pf-sweep-g,.pf-sweep-f,.pf-pulse{animation:none;opacity:1;transform:none}}</style><rect width="1600" height="900" fill="#FFFFFF"/><rect x="96" y="92" width="64" height="4" fill="#FA6D08"/><text x="176" y="100" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="26" font-weight="700" fill="#5A6B7A" letter-spacing="3">BATTERIE UND ELEKTROMOBILITÄT</text><rect x="96" y="168" width="1408" height="530" rx="12" fill="#F2F5F8" stroke="#0D2A46" stroke-width="3"/><text x="120" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="800" fill="#0D2A46" letter-spacing="2">PHASEX-LEISTUNGSUMFANG</text><rect x="815" y="578" width="230" height="34" rx="4" fill="#F2F5F8" stroke="#0D2A46" stroke-width="3"/><rect x="815" y="542" width="230" height="34" rx="4" fill="#FFFFFF" stroke="#0D
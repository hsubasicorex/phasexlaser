-system,'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="600" fill="#0D2A46">Zellsteuerung</text><text x="136" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="700" fill="#5A6B7A">06</text><text x="170" y="408" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="600" fill="#0D2A46">Absaugung</text><text x="96" y="746" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="700" fill="#5A6B7A" letter-spacing="2">Liegt bei anderen</text><path d="M96 760 H532" stroke="#5A6B7A" stroke-width="2" stroke-dasharray="6 5"/><text x="96" y="784" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="18" font-weight="500" fill="#5A6B7A">Schweißqualifizierung — Sache des Herstellers</text><path d="M578 760 H1014" stroke="#5A6B7A" stroke-width="2" stroke-dasharray="6 5"/><text x="578" y="784" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="18" font-weight="500" fill="#5A6B7A">Dichtheitsnachweis — Sache des Herstellers</text><text x="96" y="858" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="500" fill="#5A6B7A">Original-Systemschema von PhaseX. Geräteklasse und Leistungsumfang.</text></svg>

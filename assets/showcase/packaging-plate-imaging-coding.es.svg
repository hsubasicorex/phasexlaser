<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t-packaging-plate-imaging-coding d-packaging-plate-imaging-coding"><title id="t-packaging-plate-imaging-coding">Envase, grabado de planchas y codificación</title><desc id="d-packaging-plate-imaging-coding">Esquema de sistema original de PhaseX. Clase de equipo y alcance de servicio. Envase, grabado de planchas y codificación. Corresponde a terceros: Calidad de impresión — del transformador; Arte de marca — del titular de la marca.</desc><style>.pf-sweep{animation:pfx 6s linear infinite}.pf-sweep-x{animation:pfxs 5s ease-in-out infinite alternate}.pf-sweep-g{animation:pfxs 6s ease-in-out infinite alternate}.pf-sweep-f{animation:pfxf 5s ease-in-out infinite alternate}.pf-pulse{animation:pfp 3s ease-in-out infinite}@keyframes pfx{0%{opacity:0;transform:translateX(0)}8%{opacity:1}92%{opacity:1}100%{opacity:0;transform:translateX(1180px)}}@keyframes pfxs{from{transform:translateX(-120px)}to{transform:translateX(120px)}}@keyframes pfxf{from{transform:translateX(0)}to{transform:translateX(180px)}}@keyframes pfp{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.pf-sweep,.pf-sweep-x,.pf-sweep-g,.pf-sweep-f,.pf-pulse{animation:none;opacity:1;transform:none}}</style><rect width="1600" height="900" fill="#FFFFFF"/><rect x="96" y="92" width="64" height="4" fill="#FA6D08"/><text x="176" y="100" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="26" font-weight="700" fill="#5A6B7A" letter-spacing="3">ENVASE, GRABADO DE PLANCHAS Y CODIFICACIÓN</text><rect x="96" y="168" width="1408" height="530" rx="12" fill="#F2F5F8" stroke="#0D2A46" stroke-width="3"/><text x="120" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="800" fill="#0D2A46" letter-spacing="2">ALCANCE DE SERVICIO DE PHASEX</text><circle cx="186" cy="568" r="46" fill="#F2F5F8" stroke="#0D2A46" stroke-width="3"/><circle cx="186" cy="568" r="14" fill="#0D2A46"/><circle cx="1414" cy="568" r="46" fill="#F2F5F8" stroke="#0D2A46" stroke-width="3"/><circle cx="1414" cy="568" r="14" fill="#0D2A46"/><path d="M186 522 H1414" stroke="#5A6B7A" stroke-width="7" stroke-linecap="round"/><rect x="730" y="358" width="140" height="64" rx="7" fill="#FFFFFF" stroke="#0D2A46" stroke-width="3"/><path d="M785 422 L748 518 L852 518 Z" fill="#FA6D08" opacity=".35"/><g class="pf-sweep-x"><rect x="795" y="328" width="10" height="22" rx="3" fill="#FA6D08"/></g><text x="136" y="242" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="700" fill="#5A6B7A">01</text><text x="170" y="242" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="600" fill="#0D2A46">Fuente de grabado o codificación</text><text x="136" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="700" fill="#5A6B7A">02</text><text x="170" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="600" fill="#0D2A46">Cabezal y óptica</text><text x="136" y="310" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="700" fill="#5A6B7A">03</text><text x="170" y="310" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="600" fill="#0D2A46">Cilindro o banda</text><text x="1244" y="242" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="700" fill="#5A6B7A">04</text><text x="1278" y="242" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="600" fill="#0D2A46">Registro y encóders</text><text x="1244" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="700" fill="#5A6B7A">05</text><text x="1278" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="600" fill="#0D2A46">Control de máquina</text><text x="1244" y="310" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="700" fill="#5A6B7A">06</text><text x="1278" y="310" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="600" fill="#0D2A46">Extracción</text><text x="96" y="746" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="700" fill="#5A6B7A" letter-spacing="2">Corresponde a terceros</text><path d="M96 760 H484" stroke="#5A6B7A" stroke-width="2" stroke-dasharray="6 5"/><text x="96" y="784" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="18" font-weight="500" fill="#5A6B7A">Calidad de impresión — del transformador</text><path d="M530 760 H918" stroke="#5A6B7A" stroke-width="2" stroke-dasharray="6 5"/><text x="530" y="784" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="18" font-weight="500" fill="#5A6B7A">Arte de marca — del titular de la marca</text><text x="96" y="858" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="500" fill="#5A6B7A">Esquema de sistema original de PhaseX. Clase de equipo y alcance de servicio.</text></svg>

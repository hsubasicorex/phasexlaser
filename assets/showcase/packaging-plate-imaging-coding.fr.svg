<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t-packaging-plate-imaging-coding d-packaging-plate-imaging-coding"><title id="t-packaging-plate-imaging-coding">Emballage, gravure de plaques et codage</title><desc id="d-packaging-plate-imaging-coding">Schéma système original PhaseX. Classe d’équipement et périmètre d’intervention. Emballage, gravure de plaques et codage. Relève d’autrui: Qualité d’impression — celle du transformateur; Visuels de marque — ceux du propriétaire.</desc><style>.pf-sweep{animation:pfx 6s linear infinite}.pf-sweep-x{animation:pfxs 5s ease-in-out infinite alternate}.pf-sweep-g{animation:pfxs 6s ease-in-out infinite alternate}.pf-sweep-f{animation:pfxf 5s ease-in-out infinite alternate}.pf-pulse{animation:pfp 3s ease-in-out infinite}@keyframes pfx{0%{opacity:0;transform:translateX(0)}8%{opacity:1}92%{opacity:1}100%{opacity:0;transform:translateX(1180px)}}@keyframes pfxs{from{transform:translateX(-120px)}to{transform:translateX(120px)}}@keyframes pfxf{from{transform:translateX(0)}to{transform:translateX(180px)}}@keyframes pfp{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.pf-sweep,.pf-sweep-x,.pf-sweep-g,.pf-sweep-f,.pf-pulse{animation:none;opacity:1;transform:none}}</style><rect width="1600" height="900" fill="#FFFFFF"/><rect x="96" y="92" width="64" height="4" fill="#FA6D08"/><text x="176" y="100" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="26" font-weight="700" fill="#5A6B7A" letter-spacing="3">EMBALLAGE, GRAVURE DE PLAQUES ET CODAGE</text><rect x="96" y="168" width="1408" height="530" rx="12" fill="#F2F5F8" stroke="#0D2A46" stroke-width="3"/><text x="120" y="152" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="800" fill="#0D2A46" letter-spacing="2">PÉRIMÈTRE D’INTERVENTION PHASEX</text><circle cx="186" cy="568" r="46" fill="#F2F5F8" stroke="#0D2A46" stroke-width="3"/><circle cx="186" cy="568" r="14" fill="#0D2A46"/><circle cx="1414" cy="568" r="46" fill="#F2F5F8" stroke="#0D2A46" stroke-width="3"/><circle cx="1414" cy="568" r="14" fill="#0D2A46"/><path d="M186 522 H1414" stroke="#5A6B7A" stroke-width="7" stroke-linecap="round"/><rect x="730" y="358" width="140" height="64" rx="7" fill="#FFFFFF" stroke="#0D2A46" stroke-width="3"/><path d="M785 422 L748 518 L852 518 Z" fill="#FA6D08" opacity=".35"/><g class="pf-sweep-x"><rect x="795" y="328" width="10" height="22" rx="3" fill="#FA6D08"/></g><text x="136" y="242" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="700" fill="#5A6B7A">01</text><text x="170" y="242" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="600" fill="#0D2A46">Source de gravure ou codage</text><text x="136" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="700" fill="#5A6B7A">02</text><text x="170" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="600" fill="#0D2A46">Tête de balayage et optiques</text><text x="136" y="310" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="700" fill="#5A6B7A">03</text><text x="170" y="310" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="600" fill="#0D2A46">Cylindre ou bande</text><text x="1244" y="242" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="700" fill="#5A6B7A">04</text><text x="1278" y="242" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="600" fill="#0D2A46">Repérage et codeurs</text><text x="1244" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="700" fill="#5A6B7A">05</text><text x="1278" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="600" fill="#0D2A46">Commande machine</text><text x="1244" y="310" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="700" fill="#5A6B7A">06</text><text x="1278" y="310" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="600" fill="#0D2A46">Extraction</text><text x="96" y="746" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="700" fill="#5A6B7A" letter-spacing="2">Relève d’autrui</text><path d="M96 760 H542" stroke="#5A6B7A" stroke-width="2" stroke-dasharray="6 5"/><text x="96" y="784" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="18" font-weight="500" fill="#5A6B7A">Qualité d’impression — celle du transformateur</text><path d="M588 760 H1034" stroke="#5A6B7A" stroke-width="2" stroke-dasharray="6 5"/><text x="588" y="784" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="18" font-weight="500" fill="#5A6B7A">Visuels de marque — ceux du propriétaire</text><text x="96" y="858" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="500" fill="#5A6B7A">Schéma système original PhaseX. Classe d’équipement et périmètre d’intervention.</text></svg>
